# Fork-only upstream tracking.
#
# Merges pingdotgg/t3code@main into this fork's main when the merge is clean.
# On conflict it aborts, leaves main untouched, and files (or updates) a single
# issue naming the conflicting paths, so a failed sync is visible instead of a
# red cron run nobody reads.
#
# Why a merge and not a rebase: main here carries fork commits that are already
# pushed, and rebasing would rewrite published history on every sync.

name: Fork Upstream Sync

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve and report the merge without pushing"
        required: false
        default: false
        type: boolean

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'pingdotgg/t3code' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  CONFLICT_ISSUE_TITLE: "Upstream sync blocked by merge conflicts"

jobs:
  sync:
    name: Merge upstream into main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Attempt merge
        id: merge
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          target="upstream/${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "$target" HEAD; then
            echo "::notice::Already up to date with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}."
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ahead="$(git rev-list --count "HEAD..$target")"
          echo "::notice::${ahead} upstream commit(s) to merge."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit --no-ff \
              -m "chore: merge ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} ($(git rev-parse --short "$target"))" \
              "$target"; then
            # Capture the conflicting paths before unwinding the merge.
            git diff --name-only --diff-filter=U > conflicts.txt || true
            git merge --abort || git merge --quit || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "conflicts<<EOF"
              cat conflicts.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::Merge is clean; dry run, not pushing."
            echo "result=dry-run-clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin HEAD:main
          echo "result=merged" >> "$GITHUB_OUTPUT"
          echo "merged_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger workflows, so CI on the
      # merge commit has to be requested explicitly.
      - name: Run CI on the merge commit
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run fork-ci.yml --ref main

      # Issues are off by default in a fork. They are enabled here, but the
      # steps below must not turn a successful sync into a red run if that ever
      # changes, and a conflict must stay loud even without an issue tracker.
      - name: Close a stale conflict issue
        if: steps.merge.outputs.result == 'merged' || steps.merge.outputs.result == 'up-to-date'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]]; then
            echo "::notice::Issues are disabled; nothing to close."
            exit 0
          fi
          number="$(gh issue list --state open --limit 100 \
            --json number,title --jq "[.[] | select(.title == \"$CONFLICT_ISSUE_TITLE\")] | first | .number // empty")"
          if [[ -n "$number" ]]; then
            gh issue close "$number" --comment "Upstream sync succeeded; closing."
          fi

      - name: Report conflicts
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set -euo pipefail

          {
            printf 'Merging `%s@%s` into `main` hit conflicts, so `main` was left untouched.\n\n' \
              "$UPSTREAM_REPO" "$UPSTREAM_BRANCH"
            printf 'Conflicting paths:\n\n'
            printf '```\n%s\n```\n\n' "$CONFLICTS"
            printf 'Resolve locally:\n\n'
            printf '```bash\ngit fetch upstream %s\ngit merge upstream/%s\n```\n\n' \
              "$UPSTREAM_BRANCH" "$UPSTREAM_BRANCH"
            printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > body.md

          if [[ "$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]]; then
            cat body.md >> "$GITHUB_STEP_SUMMARY"
            echo "Issues are disabled, so the conflict is reported by failing this run." >&2
            exit 1
          fi

          number="$(gh issue list --state open --limit 100 \
            --json number,title --jq "[.[] | select(.title == \"$CONFLICT_ISSUE_TITLE\")] | first | .number // empty")"

          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$CONFLICT_ISSUE_TITLE" --body-file body.md
          fi

          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          printf 'Result: %s\n' "${{ steps.merge.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
