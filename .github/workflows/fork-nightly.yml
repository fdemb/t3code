# Fork-only nightly desktop release.
#
# Upstream's release.yml cannot run here: every job targets `blacksmith-*`
# runners, and its `relay_public_config` job hard-fails without the org's
# Cloudflare/Clerk configuration (release.yml:245-260). It is disabled through
# the Actions API rather than edited, so upstream merges never conflict.
#
# This builds the Linux x64 AppImage only — the one artifact this fork's owner
# runs. To add macOS or Windows, add a matrix entry with `runner: macos-latest`
# (platform mac, target dmg) or `windows-latest` (platform win, target nsis);
# note the Windows build additionally needs the WSL node-pty prebuild step from
# upstream release.yml:273-317, and unsigned macOS builds are Gatekeeper-blocked.
#
# Cloud (T3 Connect) config comes from `.env.example`, which the build reads via
# scripts/lib/public-config.ts. Those identifiers are public and are the same
# ones baked into official builds, so no secrets are involved. Delete the
# "Enable T3 Connect public config" step to build with cloud features disabled.

name: Fork Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even when main has not moved since the last nightly"
        required: false
        default: false
        type: boolean

concurrency:
  group: fork-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      previous_tag: ${{ steps.decide.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Decide
        id: decide
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          previous_tag="$(git tag --list 'fork-nightly-*' --sort=-creatordate | head -n 1)"
          should_release=true

          if [[ -n "$previous_tag" && "$FORCE" != "true" ]]; then
            if [[ "$(git rev-parse "${previous_tag}^{commit}")" == "$(git rev-parse HEAD)" ]]; then
              echo "::notice::main has not moved since $previous_tag; skipping."
              should_release=false
            fi
          fi

          # electron-builder requires semver, so the nightly suffix hangs off the
          # base version the desktop package already declares.
          base="$(node -p "require('./apps/desktop/package.json').version")"
          stamp="$(date -u +%Y%m%d)"
          version="${base}-nightly.${stamp}.${GITHUB_RUN_NUMBER}"

          {
            echo "should_release=$should_release"
            echo "version=$version"
            echo "tag=fork-nightly-$version"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Enable T3 Connect public config
        run: cp .env.example .env

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.gate.outputs.version }}"

      - name: Build desktop artifact
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.gate.outputs.version }}" \
            --verbose

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.AppImage" "release/*.exe" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          ls -l release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish nightly release
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nightly ${{ needs.gate.outputs.version }}
          generate_release_notes: true
          previous_tag: ${{ needs.gate.outputs.previous_tag }}
          prerelease: true
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  prune:
    name: Prune old nightlies
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Keep the 7 most recent nightly releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("fork-nightly-"))]
                  | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' \
            > stale.txt
          if [[ ! -s stale.txt ]]; then
            echo "Nothing to prune."
            exit 0
          fi
          while read -r tag; do
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done < stale.txt
